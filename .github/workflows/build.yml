name: Build Rhema Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: bun install

      - name: Run full setup (Bible data + AI models)
        run: bun run setup:all
        timeout-minutes: 120

      - name: Build Tauri app
        run: bun run tauri build
        timeout-minutes: 90

      - name: Upload EXE (portable)
        uses: actions/upload-artifact@v4
        with:
          name: rhema-portable-exe
          path: src-tauri/target/release/rhema.exe

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: rhema-msi-installer
          path: src-tauri/target/release/bundle/msi/*.msi
